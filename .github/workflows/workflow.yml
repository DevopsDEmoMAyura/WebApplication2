name: PipelineWorkflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
   build:
       name: AzurePipeline
       runs-on: ubuntu-latest
       steps:
      - name: Azure Pipelines Action
        uses: Azure/pipelines@v1
        with:
          azure-devops-project-url: https://dev.azure.com/mayuraupalekar/AgileProjectDemo
          azure-pipeline-name: 'WebApplication'
          azure-devops-token: ${{ secrets.AZURE_DEVOPS_TOKEN }}
       